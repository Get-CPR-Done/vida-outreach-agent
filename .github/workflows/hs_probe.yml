name: HubSpot Scope Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve + write Latest Traffic Source = AI Referrals
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, os
          TOKEN = os.environ["HUBSPOT_TOKEN"]
          H = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
          def call(method, url, body=None):
              data = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(url, data=data, headers=H, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read() or "{}")
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:400]

          WANT_PROP, WANT_OPT = "latest traffic source", "ai referrals"
          _, props = call("GET", "https://api.hubapi.com/crm/v3/properties/contacts")
          prop_name = opt_val = None
          for p in props["results"]:
              if p.get("label","").strip().lower() != WANT_PROP: continue
              if (p.get("modificationMetadata") or {}).get("readOnlyValue"): continue
              for o in p.get("options", []):
                  if o.get("label","").strip().lower() == WANT_OPT:
                      prop_name, opt_val = p["name"], o["value"]
          print(f"resolved: {prop_name} = {opt_val!r}")
          assert prop_name, "could not resolve property/option"

          st, resp = call("POST", "https://api.hubapi.com/crm/v3/objects/contacts",
                          {"properties": {"email": "vida-src-probe-0805@example.com",
                                          "firstname": "Vida", "lastname": "SrcProbe",
                                          "lifecyclestage": "salesqualifiedlead",
                                          "hs_lead_status": "NEW",
                                          prop_name: opt_val}})
          print(f"create-with-source status: {st}")
          if st in (200,201):
              cid = resp["id"]
              _, got = call("GET", f"https://api.hubapi.com/crm/v3/objects/contacts/{cid}?properties={prop_name},lifecyclestage,hs_lead_status")
              gp = got.get("properties", {})
              print(f"  read-back: {prop_name}={gp.get(prop_name)!r}  lifecycle={gp.get('lifecyclestage')!r}  lead_status={gp.get('hs_lead_status')!r}")
              dst,_ = call("DELETE", f"https://api.hubapi.com/crm/v3/objects/contacts/{cid}")
              print(f"  cleanup delete: {dst}")
          else:
              print(f"  detail: {resp}")
          PY
