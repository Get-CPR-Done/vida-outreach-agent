name: Sheet Size Probe
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Count rows + partition preview
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: |
          python3 - <<'PY'
          import os, sheets_db
          sid = os.environ.get("SPREADSHEET_ID", "1FWMATFGLXFI-cPm0bAWnU_uh20pRgatq49db_iGNQ2w")
          svc = sheets_db.service()
          # Column A holds email; count how far it's populated.
          rows = sheets_db._get(svc, sid, "A2:A200000")
          n = len(rows)
          non_empty = sum(1 for r in rows if r and r[0].strip())
          last_data_row = n + 1  # header is row 1
          print(f"rows returned (A2:A200000): {n}")
          print(f"non-empty emails: {non_empty}")
          print(f"last data row (1-indexed): {last_data_row}")
          # Vida is ~row 3503. Split remaining work evenly.
          vida_cursor = 3503
          midpoint = vida_cursor + (last_data_row - vida_cursor)//2
          print(f"suggested split point (even remaining from cursor {vida_cursor}): {midpoint}")
          print(f"  Vida range: 2..{midpoint}")
          print(f"  Elena range: {midpoint+1}..{last_data_row}")
          PY
